<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Rendszerdiagnosztika</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:system-ui,Segoe UI,Arial;
  background:#0b0f14;
  color:#e6ebf2;
}
.panel{
  max-width:900px;
  margin:40px auto;
  background:#121826;
  border-radius:16px;
  padding:24px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
h1{margin-top:0}
button{
  padding:14px 20px;
  border-radius:12px;
  border:0;
  font-weight:600;
  cursor:pointer;
}
.start{background:#3a8cff;color:white}
.opt{margin:10px 0}
label{display:flex;gap:10px;align-items:center}
.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  z-index:10;
}
.count{
  font-size:72px;
  font-weight:800;
}
</style>
</head>

<body>

<div class="panel">
  <h1>Rendszerterhelési szimuláció</h1>

  <div class="opt">
    <label><input type="checkbox" id="safe" checked> SAFE MODE</label>
  </div>

  <div class="opt">
    <label><input type="checkbox" id="fullscreen" checked> Teljes képernyő</label>
  </div>

  <div class="opt">
    <label>Lapok ciklusonként:
      <input type="number" id="tabs" value="1" min="1" max="10">
    </label>
  </div>

  <div class="opt">
    <label>Kezdő sebesség (ms):
      <input type="number" id="speed" value="1000">
    </label>
  </div>

  <button class="start" onclick="countdown()">Indítás</button>
</div>

<div class="overlay" id="cd">
  <div class="count" id="num">5</div>
</div>

<script>
let running=false;
let speed;
let opened=0;

function countdown(){
  let n=5;
  cd.style.display="flex";
  num.textContent=n;
  const t=setInterval(()=>{
    n--;
    num.textContent=n;
    if(n===0){
      clearInterval(t);
      cd.style.display="none";
      start();
    }
  },1000);
}

function start(){
  running=true;
  speed=+speedInput.value || 1000;

  if(fullscreen.checked){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  }

  if(!safe.checked){
    loop();
  }
}

function loop(){
  if(!running) return;

  for(let i=0;i<tabs.value;i++){
    const w=window.open("about:blank","_blank");
    if(w){
      w.document.open();
      w.document.write(bsodHTML());
      w.document.close();
      opened++;
    }
  }

  setTimeout(loop,speed);
}

function bsodHTML(){
return `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>System Error</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#0a5bd3;
  color:#eaf2ff;
  font-family:Segoe UI,system-ui;
}
.wrap{
  padding:60px;
}
h1{
  font-size:96px;
  margin:0 0 20px 0;
}
p{
  font-size:20px;
  opacity:.9;
}
.small{
  margin-top:40px;
  font-size:14px;
  opacity:.8;
}
</style>
</head>
<body>
  <div class="wrap">
    <h1>:(</h1>
    <p>A böngésző problémába ütközött és leállt.</p>
    <p>Hibakód: BROWSER_OVERLOAD</p>
    <div class="small">
      Ha ez az első alkalom, indítsd újra az alkalmazást.
    </div>
  </div>
</body>
</html>
`;
}

const speedInput=document.getElementById("speed");
const tabs=document.getElementById("tabs");
const safe=document.getElementById("safe");
const fullscreen=document.getElementById("fullscreen");
</script>

</body>
</html>
