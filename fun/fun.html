<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Önszaporító Rendszerfolyamat</title>
<style>
:root{
  --bg:#0b0f14;--panel:#121824;--accent:#3aa0ff;
  --danger:#ff5b5b;--text:#e7ecf3;--muted:#9aa4b2;--ok:#46d39a
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto,Arial;
  background:radial-gradient(1200px 800px at 20% 10%, #12203a, var(--bg));
  color:var(--text);
}
.container{max-width:980px;margin:40px auto;padding:24px}
.card{
  background:linear-gradient(180deg,#141b2b,var(--panel));
  border:1px solid #1f2a44;border-radius:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.45)
}
.header{padding:18px 20px;border-bottom:1px solid #1f2a44;display:flex;align-items:center;gap:12px}
.badge{padding:6px 10px;border-radius:999px;background:#1b2742;color:var(--muted);font-size:12px}
.safe{background:#14362a;color:#9af0c7}
.section{padding:20px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.kpi .box{background:#0f1629;border:1px solid #1f2a44;border-radius:12px;padding:14px;text-align:center}
.kpi .val{font-size:22px;font-weight:700}
.progress{height:10px;background:#0e1526;border-radius:999px;overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--ok),var(--accent))}
.controls label{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
button{
  border:0;border-radius:12px;padding:14px 20px;font-weight:600;cursor:pointer;
}
.primary{background:linear-gradient(135deg,#4aa8ff,#2c6cff);color:#fff}
.secondary{background:#121a2e;color:#c9d4e5;border:1px solid #2b3a66}
.footer{display:flex;justify-content:space-between;padding:16px 20px;border-top:1px solid #1f2a44}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:50}
.countdown{font-size:64px;font-weight:800;color:var(--accent);text-align:center}
.toast{position:fixed;right:20px;bottom:20px;background:#0e1526;border:1px solid #2a3a66;border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h1>Önszaporító Rendszerfolyamat</h1>
      <span class="badge">Szimuláció</span>
      <span class="badge safe" id="safeBadge">SAFE MODE</span>
    </div>
    <div class="section">
      <p>SAFE MODE esetén nincs valódi lapnyitás. Normál módban minden új lap önmagát klónozza és BSOD-t jelenít meg.</p>
      <div class="kpi">
        <div class="box"><div class="val" id="kTabs">0</div>Lapok</div>
        <div class="box"><div class="val" id="kLoad">0%</div>Terhelés</div>
        <div class="box"><div class="val" id="kTime">0s</div>Idő</div>
      </div>
      <div class="progress"><span id="bar"></span></div>

      <div class="controls">
        <label>Lapok ciklusonként: <input type="number" id="tabs" value="1" min="1" max="10"></label>
        <label>Induló sebesség (ms): <input type="number" id="startSpeed" value="1200"></label>
        <label>Cél sebesség (ms): <input type="number" id="endSpeed" value="200"></label>
        <label class="toggle"><input type="checkbox" id="safe" checked> SAFE MODE</label>
        <label class="toggle"><input type="checkbox" id="sound" checked> Hang</label>
        <label class="toggle"><input type="checkbox" id="bsodToggle" checked> BSOD új ablakokban</label>
      </div>
    </div>
    <div class="footer">
      <button class="secondary" onclick="alert('Bezárás: böngésző kilépése')">Kilépés</button>
      <button class="primary" onclick="countdown()">Indítás</button>
    </div>
  </div>
</div>

<div class="overlay" id="cd"><div class="countdown" id="cdNum">5</div></div>

<audio id="snd" loop>
  <source src="https://www.myinstants.com/media/sounds/windows-error.mp3">
</audio>

<script>
let running=false, opened=0, secs=0, currentSpeed=1000, endSpeed=200, loopActive=false;

function countdown(){
  let n=5; cd.style.display="flex"; cdNum.textContent=n;
  const t=setInterval(()=>{
    n--; cdNum.textContent=n;
    if(n===0){clearInterval(t); cd.style.display="none"; start();}
  },1000);
}

function start(){
  running=true;
  safeBadge.style.display=safe.checked?"inline-block":"none";
  currentSpeed=+startSpeed.value;
  endSpeed=+endSpeed.value;

  if(sound.checked) snd.play().catch(()=>{});

  loopActive=true;
  setInterval(updateStats,1000);

  if(!safe.checked) spawnLoop();
}

function updateStats(){
  secs++;
  const load=Math.min(100, Math.floor(opened/2));
  kTabs.textContent=opened;
  kLoad.textContent=load+"%";
  kTime.textContent=secs+"s";
  bar.style.width=load+"%";
}

function spawnLoop(){
  if(!loopActive) return;
  for(let i=0;i<+tabs.value;i++){
    const w=window.open(location.href,"_blank");
    if(w && bsodToggle.checked){
      w.document.write(bsodHTML());
      w.document.close();
      setTimeout(()=>{ try{ w.spawnFromClone(); }catch(e){} },1000);
    }
    opened++;
  }
  if(currentSpeed>endSpeed) currentSpeed-=30;
  setTimeout(spawnLoop,currentSpeed);
}

function spawnFromClone(){
  if(safe.checked) return;
  spawnLoop();
}

function bsodHTML(){
return `
<html><head><meta charset="UTF-8"><title>System Error</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0a5bd3;color:#eaf2ff;font-family:Segoe UI,system-ui}
.wrap{padding:60px} h1{font-size:96px;margin:0 0 20px} p{font-size:20px;opacity:.9}</style>
</head><body><div class="wrap"><h1>:(</h1><p>Hibakód: BROWSER_OVERLOAD</p></div></body></html>`;
}
</script>

</body>
</html>
